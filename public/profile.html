<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Profile & Settings | Pocket Option</title>
    <link rel="stylesheet" href="style.css?v=23.0">
    <style>
        body { padding-bottom: 75px; background-color: var(--bg-main); color: var(--text-main); }
        .bonus-banner {
            background: linear-gradient(90deg, #00b074, #00c853);
            color: #fff; margin: 12px 14px; padding: 10px 14px; border-radius: 20px;
            display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 700;
        }
        .accordion-wrapper { margin: 0 14px 14px; position: relative; }
        .accordion-header {
            background: var(--bg-card); border: 1px solid var(--bg-card-border);
            padding: 14px; border-radius: 8px; display: flex; justify-content: space-between;
            align-items: center; font-size: 15px; font-weight: 700; cursor: pointer; color: var(--text-main);
        }
        .accordion-menu {
            display: none; background: var(--bg-dock); border: 1px solid var(--bg-card-border);
            border-top: none; border-radius: 0 0 8px 8px; overflow: hidden;
        }
        .menu-item {
            padding: 13px 16px; border-bottom: 1px solid var(--bg-card-border);
            font-size: 14px; color: var(--text-muted); font-weight: 600; cursor: pointer;
        }
        .menu-item:hover { background: var(--bg-card); color: var(--text-main); }
        .section-box { padding: 0 14px; display: none; }
        .avatar-card { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
        .avatar-circle {
            width: 58px; height: 58px; border-radius: 50%; background: #0070f3;
            display: flex; align-items: center; justify-content: center; position: relative;
        }
        .avatar-circle svg { width: 30px; height: 30px; fill: #fff; }
        .form-field { margin-bottom: 14px; position: relative; }
        .field-label {
            position: absolute; top: -7px; left: 12px; background: var(--bg-main);
            padding: 0 5px; font-size: 11px; color: var(--text-sub); font-weight: 600; z-index: 2;
        }
        .field-input {
            width: 100%; background: var(--bg-card); border: 1px solid var(--bg-card-border);
            color: var(--text-main); padding: 12px 14px; border-radius: 6px; font-size: 14px; outline: none; font-weight: 600;
        }
        .btn-save {
            width: 100%; background: #0070f3; color: #fff; border: none; padding: 14px;
            border-radius: 6px; font-size: 15px; font-weight: 800; cursor: pointer; margin: 10px 0 20px;
        }
        .prof-badge-verified {
            color: #00e676; font-size: 11px; font-weight: 800; display: flex; align-items: center; gap: 3px;
        }
    </style>
</head>
<body class="theme-dark"> <header class="top-bar">
        <div class="account-select-pill">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="#00b074" style="margin-right:2px;"><path d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
            <span class="acc-label live" id="profileAccLabel">LIVE</span>
            <span id="headerLiveBal" style="color:var(--text-main);">$10.00</span>
            <span style="font-size:10px; color:var(--text-sub);">▼</span>
        </div>
        <div class="top-bar-right">
            <button class="deposit-btn" onclick="window.location.href='/?open=deposit'">Deposit</button>
        </div>
    </header>

    <div class="bonus-banner">
        <div>🚀 Get a <b>50% bonus</b> on your deposit!</div>
        <span style="cursor:pointer;" onclick="this.parentElement.style.display='none'">✕</span>
    </div>

    <div class="accordion-wrapper">
        <div class="accordion-header" onclick="toggleDropdownMenu()">
            <span id="activeMenuTitle">My account</span>
            <span id="accordionChevron">▼</span>
        </div>
        <div class="accordion-menu" id="accordionMenu">
            <div class="menu-item" onclick="switchSection('My account')">My account</div>
            <div class="menu-item" onclick="switchSection('Withdrawal')">Withdrawal</div>
            <div class="menu-item" onclick="switchSection('Payments')">Payments</div>
            <div class="menu-item" onclick="switchSection('Trades')">Trades</div>
            <div class="menu-item" onclick="switchSection('Tournaments')">Tournaments</div>
        </div>
    </div>

    <div id="view-my-account" class="section-box" style="display:block;">
        <div class="sec-title" style="margin: 10px 0;">Personal data:</div>
        <div class="avatar-card">
            <div class="avatar-circle">
                <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            </div>
            <div>
                <b style="font-size: 14px; color:var(--text-main);">teachsajib@gmail.com</b>
                <div style="font-size: 11px; color:var(--text-muted);">ID: 85857047</div>
                <div class="prof-badge-verified">
                    <svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
                    Verified
                </div>
            </div>
        </div>
        <div class="form-field"><span class="field-label">Nickname</span><input type="text" class="field-input" value="SojibTrader"></div>
        <div class="form-field"><span class="field-label">First Name</span><input type="text" class="field-input" value="MD Sajib"></div>
        <div class="form-field"><span class="field-label">Last Name</span><input type="text" class="field-input" value="Hossain"></div>
        <div class="form-field"><span class="field-label">Date of birth</span><input type="text" class="field-input" value="01/01/2005"></div>
        <div class="form-field"><span class="field-label">Address</span><input type="text" class="field-input" value="Akkelpur, Rajshahi, Bangladesh"></div>
        <button class="btn-save" onclick="alert('Profile saved!')">Save</button>
    </div>

    <nav class="footer-icons">
        <div class="f-icon" onclick="window.location.href='/'">
            <svg viewBox="0 0 24 24" class="f-svg-icon"><path d="M5 3C3.9 3 3 3.9 3 5v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2H5zm0 2h14v9.6l-3.3-3.3c-.4-.4-1-.4-1.4 0L10 15.6l-2.3-2.3c-.4-.4-1-.4-1.4 0L5 14.6V5z"/></svg>
        </div>
        <div class="f-icon" onclick="window.location.href='/?open=help'">
            <svg viewBox="0 0 24 24" class="f-svg-icon"><path d="M12 2C6.5 2 2 6 2 11c0 2.9 1.5 5.4 3.9 7.1L5 22l4.5-1.5c.8.3 1.7.5 2.5.5 5.5 0 10-4 10-9s-4.5-9-10-9zm.1 15c-.6 0-1.1-.5-1.1-1.1 0-.6.5-1.1 1.1-1.1.6 0 1.1.5 1.1 1.1 0 .6-.5 1.1-1.1 1.1zm1.8-6c-.5.4-.9.8-1 1.5h-1.6c.1-1.1.6-1.8 1.3-2.3.5-.4 1-.8 1-1.5 0-.8-.7-1.4-1.6-1.4-1 0-1.6.6-1.6 1.5H8.6c.1-1.7 1.4-2.9 3.3-2.9 1.8 0 3.2 1.1 3.2 2.8 0 1-.6 1.7-1.2 2.3z"/></svg>
        </div>
        <div class="f-icon active" onclick="switchSection('My account')">
            <svg viewBox="0 0 24 24" class="f-svg-icon"><path d="M12 2C9.2 2 7 4.2 7 7s2.2 5 5 5 5-2.2 5-5-2.2-5-5-5zm0 12c-4.4 0-8 2.2-8 5v3h16v-3c0-2.8-3.6-5-8-5z"/></svg>
        </div>
        <div class="f-icon" onclick="switchSection('Tournaments')">
            <svg viewBox="0 0 24 24" class="f-svg-icon"><path d="M19 4h-2V3a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v1H5a3 3 0 0 0-3 3v1a4 4 0 0 0 4 4h.3A6 6 0 0 0 11 14.9V18H9a1 1 0 0 0-1 1v2a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1h-2v-3.1A6 6 0 0 0 18.7 12H19a4 4 0 0 0 4-4V7a3 3 0 0 0-3-3zM4 8V7a1 1 0 0 1 1-1h2v4.2A2 2 0 0 1 4 8zm16 0a2 2 0 0 1-3 2V6h2a1 1 0 0 1 1 1v1z"/></svg>
            <span class="f-badge">4</span>
        </div>
        <div class="f-icon" onclick="window.location.href='/?open=menu'">
            <svg viewBox="0 0 24 24" class="f-svg-icon"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
        </div>
    </nav>
    
    </body>
</html>
