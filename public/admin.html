<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Admin | Pocket Trading Engine</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: #0b0e14; color: #e1e7f0; padding: 20px; }
        .admin-wrap { max-width: 1100px; margin: 0 auto; }
        
        /* হেডার */
        .admin-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 20px; border-bottom: 1px solid #1a2332; margin-bottom: 24px; }
        .admin-header h1 { font-size: 22px; font-weight: 800; color: #fff; display: flex; align-items: center; gap: 8px; }
        .admin-header .badge { background: #0070f3; color: #fff; font-size: 11px; padding: 3px 8px; border-radius: 4px; }

        /* গ্রিড কার্ড */
        .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; margin-bottom: 24px; }
        .card { background: #131924; border: 1px solid #1e2838; border-radius: 10px; padding: 18px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
        .card-title { font-size: 14px; font-weight: 700; color: #8fa0b5; margin-bottom: 16px; text-transform: uppercase; letter-spacing: 0.5px; }

        /* কয়েন পেআউট গ্রিড */
        .payout-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
        .payout-item { background: #1a2332; border: 1px solid #233145; padding: 12px; border-radius: 8px; display: flex; align-items: center; justify-content: space-between; }
        .p-coin-info { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; }
        .p-input-box { display: flex; align-items: center; gap: 4px; }
        .p-input { width: 55px; background: #0e141e; border: 1px solid #2a3b54; color: #00e676; font-size: 13px; font-weight: 800; padding: 5px; border-radius: 4px; text-align: center; }
        .p-btn { background: #0070f3; color: #fff; border: none; padding: 5px 10px; border-radius: 4px; font-size: 11px; font-weight: 700; cursor: pointer; }
        .p-btn:hover { background: #0056bd; }

        /* টেবিল */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
        th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #1a2332; }
        th { color: #6e829c; font-size: 11px; font-weight: 700; }
        .btn-action { padding: 5px 10px; border: none; border-radius: 4px; font-size: 11px; font-weight: 700; cursor: pointer; margin-right: 4px; }
        .btn-win { background: #00b074; color: #fff; }
        .btn-loss { background: #eb5757; color: #fff; }
        .btn-norm { background: #2a3b54; color: #fff; }
        
        .toast-notify { position: fixed; bottom: 20px; right: 20px; background: #00b074; color: #fff; padding: 10px 18px; border-radius: 6px; font-size: 13px; font-weight: 700; display: none; z-index: 100; }
    </style>
</head>
<body>
    <div class="admin-wrap">
        <header class="admin-header">
            <h1>⚡ Pocket Trading Admin Engine <span class="badge">LIVE MASTER</span></h1>
            <div id="statSummary" style="font-size: 13px; color:#8fa0b5;">Total Deposit: $0 | Total Withdraw: $0</div>
        </header>

        <div class="card" style="margin-bottom: 24px;">
            <div class="card-title">🪙 Manage 8 Crypto Coins Payout Percentage (%)</div>
            <div class="payout-grid" id="coinPayoutContainer">
                </div>
        </div>

        <div class="grid-2">
            <div class="card">
                <div class="card-title">🎯 User Control (Win / Loss Manipulation)</div>
                <table id="userTable">
                    <thead>
                        <tr><th>User</th><th>Live Bal</th><th>Demo Bal</th><th>Mode</th><th>Override</th></tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>

            <div class="card">
                <div class="card-title">💳 Deposit & Withdraw Requests</div>
                <table id="txTable">
                    <thead>
                        <tr><th>User</th><th>Type</th><th>Method</th><th>Amount</th><th>Status</th><th>Action</th></tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="adminToast" class="toast-notify"></div>

    <script>
        function showToast(msg) {
            let t = document.getElementById('adminToast');
            t.innerText = msg;
            t.style.display = 'block';
            setTimeout(() => { t.style.display = 'none'; }, 3000);
        }

        function loadAdminData() {
            fetch('/api/admin/data')
            .then(r => r.json())
            .then(d => {
                document.getElementById('statSummary').innerText = `Total Deposit: $${d.totalDeposit} | Total Withdraw: $${d.totalWithdraw}`;

                // কয়েন পেআউট কার্ডস
                let pContainer = document.getElementById('coinPayoutContainer');
                pContainer.innerHTML = '';
                for (let k in d.assets) {
                    let coin = d.assets[k];
                    let div = document.createElement('div');
                    div.className = 'payout-item';
                    div.innerHTML = `
                        <div class="p-coin-info">
                            <span>${coin.ticker}</span>
                            <small style="color:#6e829c; font-size:11px;">${coin.name}</small>
                        </div>
                        <div class="p-input-box">
                            <input type="number" id="payout-${k}" class="p-input" value="${coin.payout}" min="10" max="98">
                            <span style="font-size:12px; font-weight:800; color:#00e676;">%</span>
                            <button class="p-btn" onclick="savePayout('${k}')">Save</button>
                        </div>
                    `;
                    pContainer.appendChild(div);
                }

                // ইউজার টেবিল
                let uTbody = document.querySelector('#userTable tbody');
                uTbody.innerHTML = '';
                for (let u in d.users) {
                    let usr = d.users[u];
                    let tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td><b>${u}</b></td>
                        <td style="color:#00e676;">$${usr.liveBalance}</td>
                        <td style="color:#f5a623;">$${usr.demoBalance}</td>
                        <td><span style="font-weight:700; color:${usr.control === 'win' ? '#00b074' : (usr.control === 'loss' ? '#eb5757' : '#8fa0b5')}">${usr.control.toUpperCase()}</span></td>
                        <td>
                            <button class="btn-action btn-win" onclick="setUserMode('${u}','win')">WIN</button>
                            <button class="btn-action btn-loss" onclick="setUserMode('${u}','loss')">LOSS</button>
                            <button class="btn-action btn-norm" onclick="setUserMode('${u}','normal')">Normal</button>
                        </td>
                    `;
                    uTbody.appendChild(tr);
                }

                // ট্রানজাকশন
                let txTbody = document.querySelector('#txTable tbody');
                txTbody.innerHTML = '';
                d.transactions.forEach(tx => {
                    let tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${tx.username}</td>
                        <td><b style="color:${tx.type === 'Deposit' ? '#00b074' : '#f5a623'}">${tx.type}</b></td>
                        <td>${tx.method}</td>
                        <td>$${tx.amount}</td>
                        <td>${tx.status}</td>
                        <td>
                            ${tx.status === 'Pending' ? `
                                <button class="btn-action btn-win" onclick="handleTx(${tx.id}, 'Approved')">Approve</button>
                                <button class="btn-action btn-loss" onclick="handleTx(${tx.id}, 'Rejected')">Reject</button>
                            ` : '✔ Done'}
                        </td>
                    `;
                    txTbody.appendChild(tr);
                });
            });
        }

        function savePayout(asset) {
            let val = document.getElementById(`payout-${asset}`).value;
            fetch('/api/admin/update-payout', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ asset, payout: val })
            })
            .then(r => r.json())
            .then(d => {
                showToast(d.message);
                loadAdminData();
            });
        }

        function setUserMode(u, m) {
            fetch('/api/admin/action', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: u, action: 'control', value: m })
            }).then(() => { showToast(`User mode updated to ${m.toUpperCase()}`); loadAdminData(); });
        }

        function handleTx(id, s) {
            fetch('/api/admin/tx-action', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ txId: id, status: s })
            }).then(() => { showToast(`Transaction ${s}`); loadAdminData(); });
        }

        setInterval(loadAdminData, 4000);
        loadAdminData();
    </script>
</body>
</html>
