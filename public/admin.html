<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Control Dashboard</title>
    <style>
        body { background: #0e131b; color: #fff; font-family: sans-serif; padding: 20px; }
        .card { background: #19202c; border: 1px solid #263245; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; background: #131924; }
        th, td { padding: 10px; border: 1px solid #263245; text-align: center; }
        button { padding: 5px 10px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .win { background: #00b074; color: #fff; }
        .loss { background: #ff4747; color: #fff; }
        .norm { background: #4f5d73; color: #fff; }
    </style>
</head>
<body>
    <h2>👑 Master Admin Control Panel</h2>
    <div class="card">
        <h3>24 Hours Overview</h3>
        <p>Total Deposit: $<span id="totDep">0</span> | Total Withdraw: $<span id="totWd">0</span></p>
    </div>

    <div class="card">
        <h3>User Win/Loss Override</h3>
        <table id="userTable">
            <tr><th>Username</th><th>Live Bal</th><th>Demo Bal</th><th>Mode</th><th>Action</th></tr>
        </table>
    </div>

    <div class="card">
        <h3>Transactions (Deposit / Withdraw)</h3>
        <table id="txTable">
            <tr><th>User</th><th>Type</th><th>Method</th><th>Amount</th><th>Status</th><th>Action</th></tr>
        </table>
    </div>

    <script>
        function loadData() {
            fetch('/api/admin/data').then(r => r.json()).then(d => {
                document.getElementById('totDep').innerText = d.totalDeposit;
                document.getElementById('totWd').innerText = d.totalWithdraw;

                let uHtml = `<tr><th>Username</th><th>Live Bal</th><th>Demo Bal</th><th>Mode</th><th>Action</th></tr>`;
                for(let u in d.users) {
                    let usr = d.users[u];
                    uHtml += `<tr>
                        <td>${u}</td>
                        <td>$${usr.liveBalance}</td>
                        <td>$${usr.demoBalance}</td>
                        <td><b>${usr.control.toUpperCase()}</b></td>
                        <td>
                            <button class="win" onclick="setMode('${u}','win')">Force WIN</button>
                            <button class="loss" onclick="setMode('${u}','loss')">Force LOSS</button>
                            <button class="norm" onclick="setMode('${u}','normal')">Normal (40%)</button>
                        </td>
                    </tr>`;
                }
                document.getElementById('userTable').innerHTML = uHtml;

                let tHtml = `<tr><th>User</th><th>Type</th><th>Method</th><th>Amount</th><th>Status</th><th>Action</th></tr>`;
                d.transactions.forEach(t => {
                    tHtml += `<tr>
                        <td>${t.username}</td>
                        <td>${t.type}</td>
                        <td>${t.method}</td>
                        <td>$${t.amount}</td>
                        <td>${t.status}</td>
                        <td>
                            <button class="win" onclick="setTx(${t.id},'Approved')">Approve</button>
                            <button class="loss" onclick="setTx(${t.id},'Rejected')">Reject</button>
                        </td>
                    </tr>`;
                });
                document.getElementById('txTable').innerHTML = tHtml;
            });
        }
        function setMode(u, v) {
            fetch('/api/admin/action', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: u, action: 'control', value: v})
            }).then(() => loadData());
        }
        function setTx(id, s) {
            fetch('/api/admin/tx-action', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({txId: id, status: s})
            }).then(() => loadData());
        }
        setInterval(loadData, 3000);
        loadData();
    </script>
</body>
</html>
