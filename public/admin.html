<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Secure Admin Control Panel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="padding: 20px; background: #0b0e14;">
    <h2 style="color: #ff9800;">👑 Secure Admin Control Dashboard</h2>
    <div class="admin-stats" style="display: flex; gap: 20px; margin-bottom: 20px;">
        <div class="stat-card" style="background:#1e222d; padding:15px; border-radius:6px;">Total Approved Deposit: $<span id="totDep">0</span></div>
        <div class="stat-card" style="background:#1e222d; padding:15px; border-radius:6px;">Total Approved Withdraw: $<span id="totWd">0</span></div>
    </div>

    <h3>User Win/Loss Force Control</h3>
    <table border="1" style="width:100%; border-collapse: collapse; background:#1e222d; color:#fff;" id="userTable">
        <tr>
            <th>Username</th>
            <th>Balance</th>
            <th>Current Control</th>
            <th>Action Control</th>
        </tr>
    </table>

    <h3 style="margin-top: 30px;">Deposit & Withdrawal Requests</h3>
    <table border="1" style="width:100%; border-collapse: collapse; background:#1e222d; color:#fff;" id="txTable">
        <tr>
            <th>User</th>
            <th>Type</th>
            <th>Method</th>
            <th>Amount</th>
            <th>Details (TrxID / Acc)</th>
            <th>Status</th>
            <th>Action</th>
        </tr>
    </table>

    <script>
        function loadAdminData() {
            fetch('/api/admin/data')
            .then(res => res.json())
            .then(data => {
                document.getElementById('totDep').innerText = data.totalDeposit;
                document.getElementById('totWd').innerText = data.totalWithdraw;

                let userHtml = `<tr><th>Username</th><th>Balance</th><th>Current Control</th><th>Action Control</th></tr>`;
                for(let uname in data.users) {
                    let u = data.users[uname];
                    userHtml += `<tr>
                        <td>${uname}</td>
                        <td>$${u.balance.toFixed(2)}</td>
                        <td><b>${u.control.toUpperCase()}</b></td>
                        <td>
                            <button onclick="setUserControl('${uname}', 'win')" style="background:green; color:white; padding:5px 10px; cursor:pointer;">Force Win</button>
                            <button onclick="setUserControl('${uname}', 'loss')" style="background:red; color:white; padding:5px 10px; cursor:pointer;">Force Loss</button>
                            <button onclick="setUserControl('${uname}', 'normal')" style="background:gray; color:white; padding:5px 10px; cursor:pointer;">Normal</button>
                        </td>
                    </tr>`;
                }
                document.getElementById('userTable').innerHTML = userHtml;

                let txHtml = `<tr><th>User</th><th>Type</th><th>Method</th><th>Amount</th><th>Details</th><th>Status</th><th>Action</th></tr>`;
                data.transactions.forEach(tx => {
                    txHtml += `<tr>
                        <td>${tx.username}</td>
                        <td>${tx.type}</td>
                        <td>${tx.method}</td>
                        <td>$${tx.amount}</td>
                        <td>${tx.trxId || tx.accountNo}</td>
                        <td>${tx.status}</td>
                        <td>
                            <button onclick="txAction(${tx.id}, 'Approved')" style="background:green; color:white; padding:5px 10px; cursor:pointer;">Approve</button>
                            <button onclick="txAction(${tx.id}, 'Rejected')" style="background:red; color:white; padding:5px 10px; cursor:pointer;">Reject</button>
                        </td>
                    </tr>`;
                });
                document.getElementById('txTable').innerHTML = txHtml;
            });
        }

    function setUserControl(username, state) {
        fetch('/api/admin/action', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, action: 'control', value: state })
        }).then(() => loadAdminData());
    }

    function txAction(txId, status) {
        fetch('/api/admin/tx-action', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ txId, status })
        }).then(() => loadAdminData());
    }

    setInterval(loadAdminData, 3000);
    loadAdminData();
    </script>
</body>
</html>
