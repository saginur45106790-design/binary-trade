<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Admin | Pocket Trading Engine</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: #0b0e14; color: #e1e7f0; padding: 20px; }
        .admin-wrap { max-width: 1100px; margin: 0 auto; }
        
        .admin-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 20px; border-bottom: 1px solid #1a2332; margin-bottom: 24px; }
        .admin-header h1 { font-size: 22px; font-weight: 800; color: #fff; }
        .badge { background: #0070f3; color: #fff; font-size: 11px; padding: 3px 8px; border-radius: 4px; }

        .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 20px; margin-bottom: 24px; }
        .card { background: #131924; border: 1px solid #1e2838; border-radius: 10px; padding: 18px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
        .card-title { font-size: 14px; font-weight: 700; color: #8fa0b5; margin-bottom: 16px; text-transform: uppercase; }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; color: #8fa0b5; margin-bottom: 4px; }
        .form-control { width: 100%; background: #0e141e; border: 1px solid #2a3b54; color: #fff; padding: 10px; border-radius: 6px; font-size: 13px; outline: none; }
        .form-control:focus { border-color: #0070f3; }

        .btn-create { width: 100%; background: #00b074; color: #fff; border: none; padding: 12px; border-radius: 6px; font-size: 14px; font-weight: 800; cursor: pointer; }
        .btn-create:hover { background: #009361; }

        .bonus-item { background: #182230; border: 1px solid #253347; border-left: 4px solid #f5a623; padding: 12px; border-radius: 6px; margin-bottom: 10px; }
        .bonus-head { display: flex; justify-content: space-between; align-items: center; }
        .bonus-amt { color: #00e676; font-size: 16px; font-weight: 800; }
        .bonus-timer { font-size: 11px; color: #f5a623; font-weight: 700; margin-top: 4px; }
        .btn-del { background: #eb5757; color: #fff; border: none; padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: 700; cursor: pointer; }

        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #1a2332; }
        th { color: #6e829c; font-size: 11px; }

        .toast-notify { position: fixed; bottom: 20px; right: 20px; background: #00b074; color: #fff; padding: 10px 18px; border-radius: 6px; font-size: 13px; font-weight: 700; display: none; z-index: 100; }
    </style>
</head>
<body>
    <div class="admin-wrap">
        <header class="admin-header">
            <h1>🏆 Master Admin | 24-Hour Bonus & Controls <span class="badge">LIVE</span></h1>
        </header>

        <div class="grid-2">
            <div class="card">
                <div class="card-title">🎁 Create New 24-Hour Bonus Offer</div>
                <div class="form-group">
                    <label>Offer Title</label>
                    <input type="text" id="bTitle" class="form-control" placeholder="e.g. Weekend Mega Referral Bonus">
                </div>
                <div class="form-group">
                    <label>Bonus Category</label>
                    <select id="bType" class="form-control">
                        <option value="Referral Bonus">Referral Bonus (রেফার বোনাস)</option>
                        <option value="Trading Bonus">Trading Target Bonus (ট্রেড টার্গেট বোনাস)</option>
                        <option value="Deposit Booster">Deposit Booster (ডিপোজিট বোনাস)</option>
                        <option value="Special Festival">Special Festival (স্পেশাল অফার)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Bonus Reward Amount (USD $)</label>
                    <input type="number" id="bAmount" class="form-control" placeholder="10" min="1">
                </div>
                <div class="form-group">
                    <label>Description / Rules</label>
                    <textarea id="bDesc" class="form-control" rows="2" placeholder="Tell traders how to complete & claim this bonus..."></textarea>
                </div>
                <button class="btn-create" onclick="publishBonus()">🚀 Publish 24h Bonus</button>
            </div>

            <div class="card">
                <div class="card-title">⏳ Active 24-Hour Bonuses (Live on Trophy Icon)</div>
                <div id="activeBonusListContainer">
                    <p style="color:#6e829c; font-size:13px;">Loading active bonuses...</p>
                </div>
            </div>
        </div>

        <div class="card" style="margin-bottom:20px;">
            <div class="card-title">🎯 User Mode Control</div>
            <table>
                <thead>
                    <tr><th>User</th><th>Live Balance</th><th>Demo Balance</th><th>Status</th><th>Control</th></tr>
                </thead>
                <tbody id="userTableBody"></tbody>
            </table>
        </div>
    </div>

    <div id="toast" class="toast-notify"></div>

    <script>
        function showToast(msg) {
            let t = document.getElementById('toast');
            t.innerText = msg;
            t.style.display = 'block';
            setTimeout(() => { t.style.display = 'none'; }, 3000);
        }

        function loadData() {
            fetch('/api/admin/data')
            .then(r => r.json())
            .then(d => {
                // বোনাস তালিকা রেন্ডার
                let bContainer = document.getElementById('activeBonusListContainer');
                if (!d.bonuses || d.bonuses.length === 0) {
                    bContainer.innerHTML = `<p style="color:#6e829c; font-size:13px;">No active 24-hour bonus right now.</p>`;
                } else {
                    let now = Date.now();
                    let html = '';
                    d.bonuses.forEach(b => {
                        let msLeft = Math.max(0, (24 * 60 * 60 * 1000) - (now - b.createdAt));
                        let hrs = Math.floor(msLeft / (1000 * 60 * 60));
                        let mins = Math.floor((msLeft % (1000 * 60 * 60)) / (1000 * 60));

                        html += `
                            <div class="bonus-item">
                                <div class="bonus-head">
                                    <div>
                                        <b style="color:#fff; font-size:14px;">${b.title}</b>
                                        <span style="font-size:11px; color:#8fa0b5; display:block;">${b.type}</span>
                                    </div>
                                    <div style="text-align:right;">
                                        <span class="bonus-amt">+$${parseFloat(b.amount).toFixed(2)}</span>
                                        <button class="btn-del" onclick="deleteBonus('${b.id}')" style="display:block; margin-top:4px;">Delete</button>
                                    </div>
                                </div>
                                <p style="font-size:12px; color:#cbd5e1; margin-top:6px;">${b.description}</p>
                                <div class="bonus-timer">⏳ Expires in: ${hrs}h ${mins}m | Claimed: ${b.claimedBy ? b.claimedBy.length : 0} users</div>
                            </div>
                        `;
                    });
                    bContainer.innerHTML = html;
                }

                // ইউজার টেবিল
                let uHtml = '';
                for (let u in d.users) {
                    let usr = d.users[u];
                    uHtml += `<tr>
                        <td><b>${u}</b></td>
                        <td style="color:#00e676;">$${usr.liveBalance.toFixed(2)}</td>
                        <td style="color:#f5a623;">$${usr.demoBalance.toFixed(2)}</td>
                        <td><b>${usr.control.toUpperCase()}</b></td>
                        <td>
                            <button onclick="setMode('${u}','win')" style="background:#00b074; color:#fff; border:none; padding:4px 8px; border-radius:4px; font-weight:700; cursor:pointer;">WIN</button>
                            <button onclick="setMode('${u}','loss')" style="background:#eb5757; color:#fff; border:none; padding:4px 8px; border-radius:4px; font-weight:700; cursor:pointer; margin-left:4px;">LOSS</button>
                            <button onclick="setMode('${u}','normal')" style="background:#253347; color:#fff; border:none; padding:4px 8px; border-radius:4px; font-weight:700; cursor:pointer; margin-left:4px;">Normal</button>
                        </td>
                    </tr>`;
                }
                document.getElementById('userTableBody').innerHTML = uHtml;
            });
        }

        function publishBonus() {
            let title = document.getElementById('bTitle').value.trim();
            let type = document.getElementById('bType').value;
            let amount = document.getElementById('bAmount').value;
            let desc = document.getElementById('bDesc').value.trim();

            if (!title || !amount) return alert("Title and Amount are required!");

            fetch('/api/admin/create-bonus', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, type, amount, description: desc })
            })
            .then(r => r.json())
            .then(d => {
                showToast(d.message);
                document.getElementById('bTitle').value = '';
                document.getElementById('bAmount').value = '';
                document.getElementById('bDesc').value = '';
                loadData();
            });
        }

        function deleteBonus(id) {
            if (!confirm("Are you sure you want to delete this bonus?")) return;
            fetch('/api/admin/delete-bonus', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ bonusId: id })
            }).then(() => { showToast("Bonus deleted!"); loadData(); });
        }

        function setMode(u, m) {
            fetch('/api/admin/action', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: u, action: 'control', value: m })
            }).then(() => { showToast(`User set to ${m.toUpperCase()}`); loadData(); });
        }

        setInterval(loadData, 4000);
        loadData();
    </script>
</body>
</html>
