<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Admin | Support Helpdesk & Engine</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: #0b0e14; color: #e1e7f0; padding: 20px; }
        .admin-wrap { max-width: 1100px; margin: 0 auto; }
        
        .admin-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 20px; border-bottom: 1px solid #1a2332; margin-bottom: 24px; }
        .admin-header h1 { font-size: 22px; font-weight: 800; color: #fff; }
        .badge { background: #0070f3; color: #fff; font-size: 11px; padding: 3px 8px; border-radius: 4px; }

        .card { background: #131924; border: 1px solid #1e2838; border-radius: 10px; padding: 18px; margin-bottom: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
        .card-title { font-size: 15px; font-weight: 800; color: #8fa0b5; margin-bottom: 16px; text-transform: uppercase; }

        .ticket-item { background: #182230; border: 1px solid #253347; border-radius: 8px; padding: 16px; margin-bottom: 14px; }
        .tkt-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .tkt-user { font-size: 13px; color: #00e676; font-weight: 700; }
        .tkt-subject { font-size: 15px; font-weight: 800; color: #fff; margin-bottom: 4px; }
        .tkt-body { font-size: 13px; color: #cbd5e1; line-height: 1.5; margin-bottom: 10px; }

        .tkt-img-box img { max-width: 240px; max-height: 150px; border-radius: 6px; border: 1px solid #2c3c54; cursor: pointer; }
        
        .reply-textarea { width: 100%; background: #0e141e; border: 1px solid #2a3b54; color: #fff; padding: 10px; border-radius: 6px; font-size: 13px; outline: none; margin-top: 8px; }
        .btn-reply { background: #0070f3; color: #fff; border: none; padding: 8px 16px; border-radius: 4px; font-size: 12px; font-weight: 800; cursor: pointer; margin-top: 8px; }
        .btn-reply:hover { background: #005ecb; }

        .status-badge { font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 4px; }
        .status-pending { background: #f5a623; color: #000; }
        .status-solved { background: #00e676; color: #000; }

        .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 20px; }
        .form-control { width: 100%; background: #0e141e; border: 1px solid #2a3b54; color: #fff; padding: 10px; border-radius: 6px; font-size: 13px; outline: none; margin-bottom: 8px; }
        .btn-create { width: 100%; background: #00b074; color: #fff; border: none; padding: 10px; border-radius: 6px; font-weight: 800; cursor: pointer; }

        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #1a2332; }
        th { color: #6e829c; font-size: 11px; }

        .toast-notify { position: fixed; bottom: 20px; right: 20px; background: #00b074; color: #fff; padding: 10px 18px; border-radius: 6px; font-size: 13px; font-weight: 700; display: none; z-index: 100; }
    </style>
</head>
<body>
    <div class="admin-wrap">
        <header class="admin-header">
            <h1>🛡️ Admin Support Desk & Platform Controls <span class="badge">LIVE</span></h1>
        </header>

        <div class="card">
            <div class="card-title">💬 User Support Tickets & Inquiries</div>
            <div id="ticketsContainer">
                <p style="color:#6e829c; font-size:13px;">Loading support tickets...</p>
            </div>
        </div>

        <div class="grid-2" style="margin-bottom: 24px;">
            <div class="card">
                <div class="card-title">🎁 Publish 24-Hour Bonus</div>
                <input type="text" id="bTitle" class="form-control" placeholder="Title (e.g. Daily Bonus)">
                <select id="bType" class="form-control">
                    <option value="Referral Bonus">Referral Bonus</option>
                    <option value="Trading Bonus">Trading Target Bonus</option>
                    <option value="Deposit Booster">Deposit Booster</option>
                </select>
                <input type="number" id="bAmount" class="form-control" placeholder="Amount ($)" min="1">
                <textarea id="bDesc" class="form-control" rows="2" placeholder="Description..."></textarea>
                <button class="btn-create" onclick="publishBonus()">🚀 Publish 24h Bonus</button>
            </div>

            <div class="card">
                <div class="card-title">🎯 User Mode Control</div>
                <table>
                    <thead>
                        <tr><th>User</th><th>Live Bal</th><th>Mode</th><th>Action</th></tr>
                    </thead>
                    <tbody id="userTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="toast" class="toast-notify"></div>

    <script>
        function showToast(msg) {
            let t = document.getElementById('toast');
            t.innerText = msg;
            t.style.display = 'block';
            setTimeout(() => { t.style.display = 'none'; }, 3000);
        }

        function loadData() {
            fetch('/api/admin/data')
            .then(r => r.json())
            .then(d => {
                // ১. সাপোর্ট টিকেট তালিকা রেন্ডার
                let tContainer = document.getElementById('ticketsContainer');
                if (!d.supportTickets || d.supportTickets.length === 0) {
                    tContainer.innerHTML = `<p style="color:#6e829c; font-size:13px;">No support tickets submitted yet.</p>`;
                } else {
                    let html = '';
                    d.supportTickets.forEach(t => {
                        let isSolved = (t.status === "Solved");
                        html += `
                            <div class="ticket-item">
                                <div class="tkt-head">
                                    <div>
                                        <b style="color:#fff;">${t.id}</b> | <span class="tkt-user">${t.username}</span>
                                        <small style="color:#6e829c; display:block; font-size:11px;">${t.createdAt}</small>
                                    </div>
                                    <span class="status-badge ${isSolved ? 'status-solved' : 'status-pending'}">${t.status}</span>
                                </div>
                                <div class="tkt-subject">${t.subject}</div>
                                <div class="tkt-body">${t.message}</div>

                                ${t.screenshot ? `
                                    <div class="tkt-img-box" style="margin-bottom:10px;">
                                        <div style="font-size:11px; color:#8fa0b5; margin-bottom:4px;">User Attached Screenshot:</div>
                                        <a href="${t.screenshot}" target="_blank">
                                            <img src="${t.screenshot}" alt="Screenshot">
                                        </a>
                                    </div>
                                ` : ''}

                                ${isSolved ? `
                                    <div style="background:#13251e; border:1px solid #00e676; border-radius:6px; padding:10px; margin-top:8px;">
                                        <b style="color:#00e676; font-size:11px;">Admin Solution (${t.repliedAt}):</b>
                                        <div style="font-size:12px; color:#e2f9ee; margin-top:4px;">${t.adminReply}</div>
                                    </div>
                                ` : `
                                    <div style="margin-top:10px;">
                                        <label style="font-size:11px; color:#8fa0b5; font-weight:700;">Write Solution / Reply to User:</label>
                                        <textarea id="reply-${t.id}" class="reply-textarea" rows="2" placeholder="Explain the detailed solution for the user..."></textarea>
                                        <button class="btn-reply" onclick="sendReply('${t.id}')">Send Solution to User</button>
                                    </div>
                                `}
                            </div>
                        `;
                    });
                    tContainer.innerHTML = html;
                }

                // ২. ইউজার টেবিল
                let uHtml = '';
                for (let u in d.users) {
                    let usr = d.users[u];
                    uHtml += `<tr>
                        <td><b>${u}</b></td>
                        <td style="color:#00e676;">$${usr.liveBalance.toFixed(2)}</td>
                        <td><b>${usr.control.toUpperCase()}</b></td>
                        <td>
                            <button onclick="setMode('${u}','win')" style="background:#00b074; color:#fff; border:none; padding:4px 8px; border-radius:4px; font-weight:700; cursor:pointer;">WIN</button>
                            <button onclick="setMode('${u}','loss')" style="background:#eb5757; color:#fff; border:none; padding:4px 8px; border-radius:4px; font-weight:700; cursor:pointer; margin-left:4px;">LOSS</button>
                            <button onclick="setMode('${u}','normal')" style="background:#253347; color:#fff; border:none; padding:4px 8px; border-radius:4px; font-weight:700; cursor:pointer; margin-left:4px;">Normal</button>
                        </td>
                    </tr>`;
                }
                document.getElementById('userTableBody').innerHTML = uHtml;
            });
        }

        function sendReply(ticketId) {
            let text = document.getElementById(`reply-${ticketId}`).value.trim();
            if (!text) return alert("Please enter a reply before sending!");

            fetch('/api/admin/support-reply', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ticketId, adminReply: text })
            })
            .then(r => r.json())
            .then(d => {
                showToast(d.message);
                loadData();
            });
        }

        function publishBonus() {
            let title = document.getElementById('bTitle').value.trim();
            let type = document.getElementById('bType').value;
            let amount = document.getElementById('bAmount').value;
            let desc = document.getElementById('bDesc').value.trim();

            if (!title || !amount) return alert("Title and Amount required!");

            fetch('/api/admin/create-bonus', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, type, amount, description: desc })
            })
            .then(r => r.json())
            .then(d => {
                showToast(d.message);
                document.getElementById('bTitle').value = '';
                document.getElementById('bAmount').value = '';
                document.getElementById('bDesc').value = '';
                loadData();
            });
        }

        function setMode(u, m) {
            fetch('/api/admin/action', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: u, action: 'control', value: m })
            }).then(() => { showToast(`User set to ${m.toUpperCase()}`); loadData(); });
        }

        setInterval(loadData, 4000);
        loadData();
    </script>
</body>
</html>
