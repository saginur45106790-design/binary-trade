<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Deposits & Users</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #0b0e14; color: #e1e7f0; padding: 20px; }
        .admin-wrap { max-width: 1100px; margin: 0 auto; }
        .card { background: #131924; border: 1px solid #1e2838; border-radius: 10px; padding: 18px; margin-bottom: 20px; }
        h1, h2 { margin-bottom: 12px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
        th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #1a2332; }
        th { color: #6e829c; }
        .btn-approve { background: #00b074; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: 700; }
        .btn-reject { background: #eb5757; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: 700; margin-left: 4px; }
        .badge-pending { background: #ffb300; color: #000; padding: 2px 6px; border-radius: 4px; font-weight: 700; font-size: 11px; }
        .badge-approved { background: #00b074; color: #fff; padding: 2px 6px; border-radius: 4px; font-size: 11px; }
        .badge-rejected { background: #eb5757; color: #fff; padding: 2px 6px; border-radius: 4px; font-size: 11px; }
    </style>
</head>
<body>
    <div class="admin-wrap">
        <h1>👑 Master Admin Panel</h1>
        
        <div class="card">
            <h2>ডিপোজিট রিভিউ ও অ্যাপ্রুভাল</h2>
            <table>
                <thead>
                    <tr>
                        <th>টাইম</th>
                        <th>মেথড</th>
                        <th>পরিমাণ ($)</th>
                        <th>সেন্ডার নম্বর / ID</th>
                        <th>TrxID</th>
                        <th>স্ট্যাটাস</th>
                        <th>অ্যাকশন</th>
                    </tr>
                </thead>
                <tbody id="txList"></tbody>
            </table>
        </div>

        <div class="card">
            <h2>ইউজার ব্যালেন্স ও উইন/লস কন্ট্রোল</h2>
            <table>
                <thead>
                    <tr><th>ইউজার</th><th>লাইভ ব্যালেন্স</th><th>ডেমো ব্যালেন্স</th><th>মোড</th><th>কন্ট্রোল</th></tr>
                </thead>
                <tbody id="userList"></tbody>
            </table>
        </div>
    </div>

    <script>
        function loadData() {
            fetch('/api/admin/data').then(r => r.json()).then(d => {
                let txHtml = '';
                d.transactions.forEach(t => {
                    txHtml += `<tr>
                        <td>${t.time || 'N/A'}</td>
                        <td><b>${t.method}</b></td>
                        <td style="color:#00e676; font-weight:800;">$${t.amount}</td>
                        <td>${t.senderNumber || 'N/A'}</td>
                        <td><code>${t.trxId}</code></td>
                        <td><span class="badge-${t.status.toLowerCase()}">${t.status}</span></td>
                        <td>
                            ${t.status === 'Pending' ? `
                                <button class="btn-approve" onclick="reviewTx(${t.id}, 'Approved')">Approve (ব্যালেন্সে যোগ করুন)</button>
                                <button class="btn-reject" onclick="reviewTx(${t.id}, 'Rejected')">Reject</button>
                            ` : 'সম্পন্ন'}
                        </td>
                    </tr>`;
                });
                document.getElementById('txList').innerHTML = txHtml || '<tr><td colspan="7" style="text-align:center; color:#6e829c;">কোনো পেন্ডিং রিকোয়েস্ট নেই</td></tr>';

                let uHtml = '';
                for (let u in d.users) {
                    let usr = d.users[u];
                    uHtml += `<tr>
                        <td>${u}</td>
                        <td style="color:#00e676;">$${usr.liveBalance.toFixed(2)}</td>
                        <td style="color:#f5a623;">$${usr.demoBalance.toFixed(2)}</td>
                        <td><b>${usr.control.toUpperCase()}</b></td>
                        <td>
                            <button onclick="setControl('${u}', 'win')">Force WIN</button>
                            <button onclick="setControl('${u}', 'loss')">Force LOSS</button>
                            <button onclick="setControl('${u}', 'normal')">Normal</button>
                        </td>
                    </tr>`;
                }
                document.getElementById('userList').innerHTML = uHtml;
            });
        }

        function reviewTx(txId, status) {
            fetch('/api/admin/tx-action', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ txId, status })
            }).then(() => loadData());
        }

        function setControl(username, value) {
            fetch('/api/admin/action', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, action: 'control', value })
            }).then(() => loadData());
        }

        setInterval(loadData, 4000);
        loadData();
    </script>
</body>
</html>
