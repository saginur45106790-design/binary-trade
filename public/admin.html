<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Admin Control Console</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
    body { background: #0c121c; color: #e2e8f0; padding: 12px; }
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e2a3c; padding-bottom: 10px; margin-bottom: 12px; }
    .tabs { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 12px; }
    .t-btn { flex: 1; min-width: 80px; background: #172233; color: #8fa0b5; border: none; padding: 8px 6px; font-size: 11px; font-weight: 700; border-radius: 6px; cursor: pointer; }
    .t-btn.active { background: #0070f3; color: #fff; }
    .panel { display: none; background: #172233; border: 1px solid #233348; border-radius: 8px; padding: 12px; }
    .panel.active { display: block; }
    .input-row { margin-bottom: 10px; }
    .input-row label { display: block; font-size: 11px; color: #8fa0b5; margin-bottom: 3px; }
    .input-row input { width: 100%; background: #0c121c; border: 1px solid #233348; color: #fff; padding: 8px; border-radius: 6px; font-size: 12px; }
    .btn { background: #0070f3; color: #fff; border: none; padding: 8px 12px; border-radius: 6px; font-weight: 700; cursor: pointer; }
    .card-item { background: #0c121c; border: 1px solid #233348; border-radius: 6px; padding: 10px; margin-bottom: 8px; font-size: 12px; }
  </style>
</head>
<body>
  <div class="header">
    <h3>Admin Master Console</h3>
    <button onclick="loadAdmin()" class="btn" style="padding:4px 8px; font-size:11px;">🔄 Refresh</button>
  </div>

  <div class="tabs">
    <button class="t-btn active" onclick="showTab('trend')">Smooth Trend</button>
    <button class="t-btn" onclick="showTab('kyc')">KYC Review</button>
    <button class="t-btn" onclick="showTab('wallet')">Deposits/Withdraws</button>
    <button class="t-btn" onclick="showTab('chat')">Support Chat</button>
    <button class="t-btn" onclick="showTab('settings')">Settings & Rates</button>
  </div>

  <div id="tab-trend" class="panel active">
    <h4 style="margin-bottom:8px;">OTC Smooth Trend (No Spikes)</h4>
    <div class="input-row">
      <label>Select Asset</label>
      <select id="trendAsset" style="width:100%; background:#0c121c; border:1px solid #233348; color:#fff; padding:8px; border-radius:6px;">
        <option value="EUR_USD">EUR/USD (OTC)</option>
        <option value="BTC">Bitcoin (OTC)</option>
        <option value="ETH">Ethereum (OTC)</option>
        <option value="GOLD">Gold (OTC)</option>
      </select>
    </div>
    <div class="input-row">
      <label>Direction</label>
      <select id="trendDir" style="width:100%; background:#0c121c; border:1px solid #233348; color:#fff; padding:8px; border-radius:6px;">
        <option value="UP">▲ Smooth UP</option>
        <option value="DOWN">▼ Smooth DOWN</option>
        <option value="NORMAL">⚪ Normal</option>
      </select>
    </div>
    <div class="input-row">
      <label>Duration (Minutes)</label>
      <input type="number" id="trendMinutes" value="5">
    </div>
    <button class="btn" onclick="applyTrend()">Apply Smooth Trend</button>
  </div>

  <div id="tab-kyc" class="panel">
    <h4 style="margin-bottom:8px;">KYC / NID Verification Requests</h4>
    <div id="kycContainer"></div>
  </div>

  <div id="tab-wallet" class="panel">
    <h4 style="margin-bottom:8px;">Pending Deposits & Withdrawals</h4>
    <div id="walletContainer"></div>
  </div>

  <div id="tab-chat" class="panel">
    <h4 style="margin-bottom:8px;">User Messages</h4>
    <div id="adminChatBox" style="max-height:250px; overflow-y:auto; margin-bottom:8px;"></div>
    <div style="display:flex; gap:6px;">
      <input type="text" id="adminReplyText" placeholder="Reply as Admin..." style="flex:1; background:#0c121c; border:1px solid #233348; color:#fff; padding:8px; border-radius:6px;">
      <button class="btn" onclick="sendAdminReply()">Reply</button>
    </div>
  </div>

  <div id="tab-settings" class="panel">
    <h4 style="margin-bottom:8px;">Platform Exchange Rate & Links</h4>
    <div class="input-row">
      <label>1 USD = (BDT)</label>
      <input type="number" id="admDollarRate">
    </div>
    <div class="input-row">
      <label>Telegram Partner Channel Link</label>
      <input type="text" id="admTeleLink">
    </div>
    <div class="input-row">
      <label>bKash Personal Number</label>
      <input type="text" id="admBkash">
    </div>
    <div class="input-row">
      <label>Nagad Personal Number</label>
      <input type="text" id="admNagad">
    </div>
    <button class="btn" onclick="saveAdminSettings()">Save Platform Config</button>
  </div>

  <script>
    function showTab(t) {
      document.querySelectorAll('.t-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById('tab-' + t).classList.add('active');
    }

    function loadAdmin() {
      fetch('/api/admin/overview').then(r => r.json()).then(d => {
        document.getElementById('admDollarRate').value = d.config.dollarRate;
        document.getElementById('admTeleLink').value = d.config.telegramLink;
        document.getElementById('admBkash').value = d.config.bkashNumber;
        document.getElementById('admNagad').value = d.config.nagadNumber;

        // KYC
        let kycHtml = '';
        for (let id in d.users) {
          let u = d.users[id];
          if (u.verificationStatus === 'Pending') {
            kycHtml += `
              <div class="card-item">
                <b>${u.name} (ID: ${u.id})</b>
                <p>Status: ${u.verificationStatus}</p>
                <button class="btn" style="background:#00e676; padding:3px 8px; margin-top:4px;" onclick="actionKyc('${u.id}', 'approve')">Approve</button>
                <button class="btn" style="background:#eb5757; padding:3px 8px; margin-top:4px;" onclick="actionKyc('${u.id}', 'reject')">Reject</button>
              </div>
            `;
          }
        }
        document.getElementById('kycContainer').innerHTML = kycHtml || '<p style="color:#8fa0b5;">No pending KYC.</p>';

        // ওয়ালেট
        let wHtml = '';
        d.deposits.filter(x => x.status === 'Pending').forEach(dep => {
          wHtml += `
            <div class="card-item">
              <b>Deposit: $${dep.amount} (${dep.method})</b>
              <p>TrxID: ${dep.trxId} | User: ${dep.userId}</p>
              <button class="btn" style="background:#00e676; padding:3px 8px;" onclick="actionDep('${dep.id}', 'approve')">Approve</button>
              <button class="btn" style="background:#eb5757; padding:3px 8px;" onclick="actionDep('${dep.id}', 'reject')">Reject</button>
            </div>
          `;
        });
        d.withdrawals.filter(x => x.status === 'Pending').forEach(w => {
          wHtml += `
            <div class="card-item">
              <b>Withdrawal: $${w.amount} (${w.method})</b>
              <p>Details: ${w.accountDetails} | User: ${w.userId}</p>
              <button class="btn" style="background:#00e676; padding:3px 8px;" onclick="actionWith('${w.id}', 'approve')">Approve</button>
              <button class="btn" style="background:#eb5757; padding:3px 8px;" onclick="actionWith('${w.id}', 'reject')">Reject</button>
            </div>
          `;
        });
        document.getElementById('walletContainer').innerHTML = wHtml || '<p style="color:#8fa0b5;">No pending transactions.</p>';
      });

      // চ্যাট
      fetch('/api/support/messages').then(r => r.json()).then(d => {
        let h = '';
        d.messages.forEach(m => {
          h += `<div style="font-size:11px; margin-bottom:4px;"><b>${m.sender}:</b> ${m.text}</div>`;
        });
        document.getElementById('adminChatBox').innerHTML = h;
      });
    }

    function applyTrend() {
      fetch('/api/admin/set-trend', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          asset: document.getElementById('trendAsset').value,
          direction: document.getElementById('trendDir').value,
          minutes: document.getElementById('trendMinutes').value
        })
      }).then(r => r.json()).then(d => alert(d.message));
    }

    function actionKyc(userId, action) {
      fetch('/api/admin/action-kyc', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId, action })
      }).then(() => loadAdmin());
    }

    function actionDep(id, action) {
      fetch('/api/admin/action-deposit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, action })
      }).then(() => loadAdmin());
    }

    function actionWith(id, action) {
      fetch('/api/admin/action-withdraw', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, action })
      }).then(() => loadAdmin());
    }

    function sendAdminReply() {
      let txt = document.getElementById('adminReplyText').value;
      if (!txt) return;
      fetch('/api/support/send', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sender: 'Admin', text: txt })
      }).then(() => {
        document.getElementById('adminReplyText').value = '';
        loadAdmin();
      });
    }

    function saveAdminSettings() {
      fetch('/api/admin/config-update', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          dollarRate: document.getElementById('admDollarRate').value,
          telegramLink: document.getElementById('admTeleLink').value,
          bkashNumber: document.getElementById('admBkash').value,
          nagadNumber: document.getElementById('admNagad').value
        })
      }).then(r => r.json()).then(d => alert(d.message));
    }

    loadAdmin();
  </script>
</body>
</html>
