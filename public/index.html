<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trading Engine</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-wrap">
        <header class="top-nav">
            <div class="brand">
                <span class="pulse-dot"></span> EUR/USD <span class="badge">OTC</span>
            </div>
            <div class="user-meta">
                <div class="bal-badge">Live: $<span id="balance">1000.00</span></div>
                <button class="nav-btn dep" onclick="openModal('depModal')">Deposit</button>
                <button class="nav-btn wdr" onclick="openModal('wdModal')">Withdraw</button>
            </div>
        </header>

        <div class="chart-viewport">
            <div class="chart-stats">
                <span class="price-val" id="priceDisplay">1.08500</span>
                <span class="payout-val">+85% Payout</span>
            </div>
            <canvas id="candleCanvas"></canvas>
        </div>

        <div class="trade-dock">
            <div class="dock-row">
                <div class="input-box">
                    <label>Duration</label>
                    <select id="timeframe">
                        <option value="5">5s (Quick)</option>
                        <option value="60" selected>1m</option>
                        <option value="300">5m</option>
                        <option value="1800">30m</option>
                    </select>
                </div>
                <div class="input-box">
                    <label>Investment ($)</label>
                    <input type="number" id="tradeAmount" value="10" min="1">
                </div>
            </div>
            <div class="btn-actions">
                <button class="trade-btn up" onclick="executeTrade('UP')">
                    <span>CALL / UP</span>
                    <small>▲ High</small>
                </button>
                <button class="trade-btn down" onclick="executeTrade('DOWN')">
                    <span>PUT / DOWN</span>
                    <small>▼ Low</small>
                </button>
            </div>
            <div id="tradeNotice" class="notice-bar"></div>
        </div>
    </div>

    <div id="depModal" class="modal-layer">
        <div class="modal-box">
            <span class="modal-close" onclick="closeModal('depModal')">&times;</span>
            <h4>Deposit Balance</h4>
            <div class="pay-info">Bkash/Nagad: <b>01700000000</b> | Binance ID: <b>98765432</b></div>
            <select id="depMethod">
                <option value="Bkash">Bkash</option>
                <option value="Nagad">Nagad</option>
                <option value="Binance">Binance Pay (USDT)</option>
            </select>
            <input type="number" id="depAmount" placeholder="Amount ($)">
            <input type="text" id="depTrx" placeholder="Transaction ID (TrxID)">
            <button class="modal-submit" onclick="submitDeposit()">Submit</button>
        </div>
    </div>

    <div id="wdModal" class="modal-layer">
        <div class="modal-box">
            <span class="modal-close" onclick="closeModal('wdModal')">&times;</span>
            <h4>Withdraw Funds</h4>
            <select id="wdMethod">
                <option value="Bkash">Bkash</option>
                <option value="Nagad">Nagad</option>
                <option value="Binance">Binance</option>
            </select>
            <input type="number" id="wdAmount" placeholder="Amount ($)">
            <input type="text" id="wdAcc" placeholder="Account No / Pay ID">
            <button class="modal-submit" onclick="submitWithdraw()">Request</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
